name: Build unsigned EncontrarMovil v1.4
on:
  push:
    branches: [build-encontrar-movil-v1-4-unsigned]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rebuild source archive
        run: |
          cat apk-part-00.txt apk-part-01.txt apk-part-02a.txt apk-part-02b.txt apk-part-02c.txt apk-part-02d.txt apk-part-03.txt apk-part-04.txt | base64 -d > /tmp/EncontrarMovil-v1.3.zip
          unzip -t /tmp/EncontrarMovil-v1.3.zip
          unzip -q /tmp/EncontrarMovil-v1.3.zip -d /tmp/findphone-src

      - name: Harden source for v1.4
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('/tmp/findphone-src/android')

          manifest=base/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          s=s.replace('    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />\n','')
          s=s.replace('    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n','')
          manifest.write_text(s)

          build=base/'app/build.gradle'
          s=build.read_text().replace('versionCode 4','versionCode 5').replace("versionName '1.3.0'","versionName '1.4.0'")
          build.write_text(s)

          main=base/'app/src/main/java/com/findphone/home/MainActivity.java'
          s=main.read_text()
          s=s.replace(
              '        Button battery = button("Excluir del ahorro de batería"); root.addView(battery);\n'
              '        battery.setOnClickListener(v -> requestBatteryExemption());\n',
              '        Button battery = button("Abrir ajustes de batería"); root.addView(battery);\n'
              '        battery.setOnClickListener(v -> openBatterySettings());\n'
          )
          s=s.replace(
              '        Button dnd = button("Ajustar No molestar para permitir alarmas"); root.addView(dnd);\n'
              '        dnd.setOnClickListener(v -> {\n'
              '            try { startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)); }\n'
              '            catch (Exception e) { startActivity(new Intent(Settings.ACTION_SOUND_SETTINGS)); }\n'
              '        });\n',
              '        Button dnd = button("Abrir ajustes de sonido / No molestar"); root.addView(dnd);\n'
              '        dnd.setOnClickListener(v -> {\n'
              '            try { startActivity(new Intent(Settings.ACTION_SOUND_SETTINGS)); }\n'
              '            catch (Exception ignored) { }\n'
              '        });\n'
          )
          start=s.find('    private void requestBatteryExemption() {')
          end=s.find('    private void openVendorBackgroundSettings()', start)
          assert start >= 0 and end > start
          replacement=(
              '    private void openBatterySettings() {\n'
              '        try {\n'
              '            Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()));\n'
              '            startActivity(i);\n'
              '        } catch (Exception ignored) { }\n'
              '    }\n\n'
          )
          s=s[:start]+replacement+s[end:]
          main.write_text(s)
          PY
          ! grep -R "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" -n /tmp/findphone-src/android/app/src/main
          ! grep -R "ACCESS_NOTIFICATION_POLICY" -n /tmp/findphone-src/android/app/src/main

      - name: Build unsigned release
        working-directory: /tmp/findphone-src/android
        run: gradle assembleRelease --stacktrace

      - name: Align unsigned APK and package signing tool
        run: |
          mkdir -p /tmp/out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4             /tmp/findphone-src/android/app/build/outputs/apk/release/app-release-unsigned.apk             /tmp/out/EncontrarMovil-v1.4-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/out/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/out/EncontrarMovil-v1.4-aligned-unsigned.apk | tee /tmp/out/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions /tmp/out/EncontrarMovil-v1.4-aligned-unsigned.apk | tee /tmp/out/permissions.txt
          grep "versionName='1.4.0'" /tmp/out/badging.txt
          ! grep "ACCESS_NOTIFICATION_POLICY" /tmp/out/permissions.txt
          ! grep "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" /tmp/out/permissions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EncontrarMovil-v1.4-unsigned-tools
          path: /tmp/out/*
