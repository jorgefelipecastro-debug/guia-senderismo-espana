name: Build EncontrarMovil v1.6 wizard unsigned
on:
  push:
    branches: [build-encontrar-movil-v1-6-wizard]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat apk-part-00.txt apk-part-01.txt apk-part-02a.txt apk-part-02b.txt apk-part-02c.txt apk-part-02d.txt apk-part-03.txt apk-part-04.txt | base64 -d > EncontrarMovil-Android-source-v1.3.zip
          unzip -t EncontrarMovil-Android-source-v1.3.zip
          unzip -q EncontrarMovil-Android-source-v1.3.zip

      - name: Apply security hardening
        run: python scripts/harden_encontrar_movil_v15.py

      - name: Add adaptive setup wizard
        run: python scripts/setup_wizard_v16.py

      - name: Upgrade release metadata to v1.6.0 / API 36
        run: |
          sed -i "s/versionCode 9/versionCode 10/" android/app/build.gradle
          sed -i "s/versionName '1.5.2'/versionName '1.6.0'/" android/app/build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/" android/app/build.gradle
          sed -i "s/targetSdk 35/targetSdk 36/" android/app/build.gradle
          sed -i "s/version '8.8.2'/version '8.9.1'/" android/build.gradle

      - name: Security checks
        shell: bash
        run: |
          if grep -R -E "ServerSocket|0\.0\.0\.0|localPort|localPin" -n android/app/src/main; then exit 1; fi
          if grep -R "http://" -n android/app/src/main/java; then exit 1; fi
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml
          grep -q 'android:exported="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'Paso ' android/app/src/main/java/com/findphone/home/MainActivity.java
          grep -q 'ACTION_ZEN_MODE_SETTINGS' android/app/src/main/java/com/findphone/home/MainActivity.java
          grep -q 'ACTION_APP_DATA_USAGE_SETTINGS' android/app/src/main/java/com/findphone/home/MainActivity.java

      - name: Build release APK and AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Align unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            EncontrarMovil-v1.6.0-wizard-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 EncontrarMovil-v1.6.0-wizard-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          cp android/app/build/outputs/bundle/release/app-release.aab EncontrarMovil-v1.6.0-unsigned.aab
          sha256sum EncontrarMovil-v1.6.0-wizard-unsigned-aligned.apk EncontrarMovil-v1.6.0-unsigned.aab > SHA256SUMS-v1.6.0.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EncontrarMovil-v1.6.0-wizard-unsigned-tools
          path: |
            EncontrarMovil-v1.6.0-wizard-unsigned-aligned.apk
            EncontrarMovil-v1.6.0-unsigned.aab
            SHA256SUMS-v1.6.0.txt
            apksigner.jar
