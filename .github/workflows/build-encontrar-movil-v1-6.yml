name: Build EncontrarMovil v1.7 lockscreen alarm unsigned
on:
  push:
    branches: [build-encontrar-movil-v1-7-lock-alarm]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat apk-part-00.txt apk-part-01.txt apk-part-02a.txt apk-part-02b.txt apk-part-02c.txt apk-part-02d.txt apk-part-03.txt apk-part-04.txt | base64 -d > EncontrarMovil-Android-source-v1.3.zip
          unzip -t EncontrarMovil-Android-source-v1.3.zip
          unzip -q EncontrarMovil-Android-source-v1.3.zip

      - name: Apply security hardening
        run: python scripts/harden_encontrar_movil_v15.py

      - name: Add adaptive setup wizard
        run: python scripts/setup_wizard_v16.py

      - name: Add lock-screen alarm controls
        run: python scripts/lockscreen_alarm_v17.py

      - name: Upgrade release metadata to v1.7.0 / API 36
        run: |
          sed -i "s/versionCode 9/versionCode 11/" android/app/build.gradle
          sed -i "s/versionName '1.5.2'/versionName '1.7.0'/" android/app/build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/" android/app/build.gradle
          sed -i "s/targetSdk 35/targetSdk 36/" android/app/build.gradle
          sed -i "s/version '8.8.2'/version '8.9.1'/" android/build.gradle

      - name: Security checks
        shell: bash
        run: |
          if grep -R -E "ServerSocket|0\.0\.0\.0|localPort|localPin" -n android/app/src/main; then exit 1; fi
          if grep -R "http://" -n android/app/src/main/java; then exit 1; fi
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml
          grep -q 'android:exported="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'Paso ' android/app/src/main/java/com/findphone/home/MainActivity.java
          grep -q 'android.settings.ZEN_MODE_SETTINGS' android/app/src/main/java/com/findphone/home/MainActivity.java
          grep -q 'android.settings.APP_DATA_USAGE_SETTINGS' android/app/src/main/java/com/findphone/home/MainActivity.java
          grep -q 'find_phone_alarm_v17' android/app/src/main/java/com/findphone/home/FindPhoneService.java
          grep -q 'DETENER ALARMA' android/app/src/main/java/com/findphone/home/FindPhoneService.java
          grep -q 'VISIBILITY_PUBLIC' android/app/src/main/java/com/findphone/home/FindPhoneService.java

      - name: Build release APK and AAB
        id: android_build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --stacktrace 2>&1 | tee ../build-v1.6.log

      - name: Report build error for debugging
        if: steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 220 build-v1.6.log > build-error-v1.6.txt
          gh issue create --title "TEMP build error EncontrarMovil v1.6 run $GITHUB_RUN_ID" --body-file build-error-v1.6.txt
          exit 1

      - name: Align unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            EncontrarMovil-v1.7.0-lockscreen-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 EncontrarMovil-v1.7.0-lockscreen-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          cp android/app/build/outputs/bundle/release/app-release.aab EncontrarMovil-v1.7.0-unsigned.aab
          sha256sum EncontrarMovil-v1.7.0-lockscreen-unsigned-aligned.apk EncontrarMovil-v1.7.0-unsigned.aab > SHA256SUMS-v1.7.0.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EncontrarMovil-v1.7.0-lockscreen-unsigned-tools
          path: |
            EncontrarMovil-v1.7.0-lockscreen-unsigned-aligned.apk
            EncontrarMovil-v1.7.0-unsigned.aab
            SHA256SUMS-v1.7.0.txt
            apksigner.jar
