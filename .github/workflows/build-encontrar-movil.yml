name: Build EncontrarMovil APK
on:
  push:
    branches: [build-encontrar-movil-v1-3]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source
        run: unzip EncontrarMovil-Android-source-v1.3.zip
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EncontrarMovil-v1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EncontrarMovil-v1.3-apk
          path: EncontrarMovil-v1.3.apk
