name: Build EncontrarMovil APK
on:
  push:
    branches: [build-encontrar-movil-v1-3]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rebuild source archive
        run: |
          cat apk-part-00.txt apk-part-01.txt apk-part-02a.txt apk-part-02b.txt apk-part-02c.txt apk-part-02d.txt apk-part-03.txt apk-part-04.txt | base64 -d > EncontrarMovil-Android-source-v1.3.zip

      - name: Verify source archive
        run: unzip -t EncontrarMovil-Android-source-v1.3.zip

      - name: Unpack source
        run: unzip -q EncontrarMovil-Android-source-v1.3.zip

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Stage and verify APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EncontrarMovil-v1.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose EncontrarMovil-v1.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging EncontrarMovil-v1.3.apk | head -20
          sha256sum EncontrarMovil-v1.3.apk | tee SHA256SUMS.txt
          ls -lh EncontrarMovil-v1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EncontrarMovil-v1.3-apk
          path: |
            EncontrarMovil-v1.3.apk
            SHA256SUMS.txt

      - name: Publish direct-download APK on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f EncontrarMovil-v1.3.apk SHA256SUMS.txt
          git commit -m "Publicar APK EncontrarMovil v1.3 [skip ci]"
          git push origin HEAD:build-encontrar-movil-v1-3
