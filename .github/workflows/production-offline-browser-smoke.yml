name: Production Offline Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-offline-browser-smoke
  cancel-in-progress: true

jobs:
  browser-offline-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for exact Railway release
        env:
          BASE_URL: https://encumbrate-web-production.up.railway.app
        run: |
          EXPECTED="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            RELEASE=$(curl -fsS "$BASE_URL/api/release" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).release||'')}catch{}})" || true)
            if [ "$RELEASE" = "$EXPECTED" ]; then
              echo "Railway is serving $RELEASE"
              exit 0
            fi
            echo "Waiting for Railway release $EXPECTED (current: ${RELEASE:-unavailable})"
            sleep 10
          done
          echo "Railway never served expected release $EXPECTED"
          exit 1

      - name: Verify real LiveRouteGuide offline fallback in Chromium
        env:
          BASE_URL: https://encumbrate-web-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            geolocation: { latitude: 38.3452, longitude: -0.4815, accuracy: 6 },
            permissions: ['geolocation'],
            viewport: { width: 390, height: 844 },
            serviceWorkers: 'block',
          });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);
          let blockedOsmRequests = 0;
          const blockedOsmUrls = [];
          const pageErrors = [];
          const consoleErrors = [];
          const failedRequests = [];

          page.on('pageerror', error => {
            pageErrors.push({ name: error.name, message: error.message, stack: error.stack });
            console.log('E2E_PAGE_ERROR', error.stack || error.message);
          });
          page.on('console', message => {
            if (message.type() === 'error') {
              consoleErrors.push(message.text());
              console.log('E2E_CONSOLE_ERROR', message.text());
            }
          });
          page.on('requestfailed', request => {
            const url = request.url();
            if (!url.includes('tile.openstreetmap.org')) {
              const failure = { url, errorText: request.failure()?.errorText || null };
              failedRequests.push(failure);
              console.log('E2E_REQUEST_FAILED', JSON.stringify(failure));
            }
          });

          try {
            await page.route('**/*', async route => {
              const url = route.request().url();
              let hostname = '';
              try { hostname = new URL(url).hostname; } catch {}
              if (hostname === 'tile.openstreetmap.org' || hostname.endsWith('.tile.openstreetmap.org')) {
                blockedOsmRequests += 1;
                if (blockedOsmUrls.length < 3) blockedOsmUrls.push(url);
                await route.abort('failed');
                return;
              }
              await route.continue();
            });

            const response = await page.goto(base + '/offline-map-smoke-e2e', { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error(`E2E route returned ${response?.status() ?? 'no response'}`);

            try {
              await page.getByText('Mapa offline preparado', { exact: false }).waitFor();
            } catch (error) {
              const startupDebug = await page.evaluate(() => ({
                bodyText: document.body?.innerText?.slice(0, 2000) || '',
                statusTitle: document.querySelector('.liveGuideStatus strong')?.textContent || null,
                statusDetail: document.querySelector('.liveGuideStatus small')?.textContent || null,
                offlineText: document.querySelector('.liveGuideOffline')?.textContent || null,
                liveGuidePresent: Boolean(document.querySelector('.liveGuide')),
                leafletPresent: Boolean(document.querySelector('.leaflet-container')),
                ignPresent: Boolean(document.querySelector('.leaflet-image-layer')),
                navigatorOnline: navigator.onLine,
              }));
              throw new Error(`Offline map never became ready: ${JSON.stringify({ startupDebug, pageErrors, consoleErrors, failedRequests })}`, { cause: error });
            }

            await page.waitForFunction(() => document.querySelectorAll('.leaflet-tile-pane img').length > 0 || document.querySelector('.liveGuideOffline'), null, { timeout: 15000 }).catch(() => {});
            if (blockedOsmRequests < 1) {
              const debug = await page.evaluate(() => ({
                navigatorOnline: navigator.onLine,
                tileImages: [...document.querySelectorAll('.leaflet-tile-pane img')].slice(0,5).map(img => img.src),
                offlineText: document.querySelector('.liveGuideOffline')?.textContent || null,
              }));
              throw new Error(`E2E did not intercept any OSM tile request: ${JSON.stringify(debug)}`);
            }
            console.log('OSM_E2E_BLOCK_CONFIRMED', JSON.stringify({ blockedOsmRequests, blockedOsmUrls }));

            try {
              await page.getByText('Cartografía offline activa · mapa online no disponible', { exact: true }).waitFor();
            } catch (error) {
              const debug = await page.evaluate(() => {
                const image = document.querySelector('.leaflet-image-layer');
                const tileLayer = document.querySelector('.leaflet-tile-pane .leaflet-layer');
                return {
                  navigatorOnline: navigator.onLine,
                  offlineText: document.querySelector('.liveGuideOffline')?.textContent || null,
                  ignPresent: Boolean(image),
                  ignOpacity: image ? Number(getComputedStyle(image).opacity) : null,
                  tileOpacity: tileLayer ? Number(getComputedStyle(tileLayer).opacity) : null,
                  tileImages: [...document.querySelectorAll('.leaflet-tile-pane img')].slice(0,5).map(img => ({src:img.src,complete:img.complete,naturalWidth:img.naturalWidth})),
                };
              });
              throw new Error(`Offline fallback status did not appear after ${blockedOsmRequests} blocked OSM requests: ${JSON.stringify(debug)}`, { cause: error });
            }

            await context.setGeolocation({ latitude: 38.34521, longitude: -0.48149, accuracy: 6 });
            try {
              await page.locator('.hikerArrowIcon').waitFor({ timeout: 15000 });
            } catch (error) {
              const gpsDebug = await page.evaluate(() => ({
                statusTitle: document.querySelector('.liveGuideStatus strong')?.textContent || null,
                statusDetail: document.querySelector('.liveGuideStatus small')?.textContent || null,
                geolocationAvailable: Boolean(navigator.geolocation),
                navigatorOnline: navigator.onLine,
              }));
              throw new Error(`GPS marker did not appear after explicit geolocation update: ${JSON.stringify(gpsDebug)}`, { cause: error });
            }

            const onlineFallback = await page.evaluate(() => {
              const image = document.querySelector('.leaflet-image-layer');
              const tileLayer = document.querySelector('.leaflet-tile-pane .leaflet-layer');
              if (!image) throw new Error('LiveRouteGuide did not mount the IGN imageOverlay');
              const imageStyle = getComputedStyle(image);
              const tileStyle = tileLayer ? getComputedStyle(tileLayer) : null;
              const rect = image.getBoundingClientRect();
              return {
                navigatorOnline: navigator.onLine,
                imageOpacity: Number(imageStyle.opacity),
                imageNaturalWidth: image.naturalWidth,
                imageNaturalHeight: image.naturalHeight,
                imageVisibleWidth: rect.width,
                imageVisibleHeight: rect.height,
                tileOpacity: tileStyle ? Number(tileStyle.opacity) : null,
              };
            });

            if (!onlineFallback.navigatorOnline) throw new Error('tileerror fallback was not tested while navigator.onLine=true');
            if (onlineFallback.imageOpacity < 0.99 || onlineFallback.imageNaturalWidth < 256 || onlineFallback.imageNaturalHeight < 256)
              throw new Error(`IGN overlay not visibly rendered during tile failure: ${JSON.stringify(onlineFallback)}`);
            if (onlineFallback.imageVisibleWidth <= 0 || onlineFallback.imageVisibleHeight <= 0)
              throw new Error(`IGN overlay is outside the visible Leaflet map: ${JSON.stringify(onlineFallback)}`);
            if (onlineFallback.tileOpacity !== null && onlineFallback.tileOpacity > 0.01)
              throw new Error(`OSM tile layer was not hidden after tileerror: ${JSON.stringify(onlineFallback)}`);

            await context.setOffline(true);
            await page.getByText('Sin conexión · cartografía offline activa', { exact: true }).waitFor();
            await page.waitForTimeout(1500);

            const fullyOffline = await page.evaluate(() => {
              const image = document.querySelector('.leaflet-image-layer');
              if (!image) throw new Error('IGN overlay disappeared after full network cutoff');
              const rect = image.getBoundingClientRect();
              return {
                navigatorOnline: navigator.onLine,
                opacity: Number(getComputedStyle(image).opacity),
                naturalWidth: image.naturalWidth,
                naturalHeight: image.naturalHeight,
                visibleWidth: rect.width,
                visibleHeight: rect.height,
                markerVisible: Boolean(document.querySelector('.hikerArrowIcon')),
              };
            });

            if (fullyOffline.navigatorOnline) throw new Error('Chromium did not enter offline mode');
            if (fullyOffline.opacity < 0.99 || fullyOffline.naturalWidth < 256 || fullyOffline.naturalHeight < 256)
              throw new Error(`stored IGN overlay did not survive full cutoff: ${JSON.stringify(fullyOffline)}`);
            if (fullyOffline.visibleWidth <= 0 || fullyOffline.visibleHeight <= 0 || !fullyOffline.markerVisible)
              throw new Error(`map or location marker is not visible offline: ${JSON.stringify(fullyOffline)}`);

            const serviceWorkerRegistrationError = consoleErrors.find(message => message.includes('No se pudo registrar el service worker'));
            if (serviceWorkerRegistrationError) throw new Error(`Service worker registration emitted an application error: ${serviceWorkerRegistrationError}`);

            console.log('LIVE_ROUTE_GUIDE_OFFLINE_E2E_SUCCESS', JSON.stringify({ blockedOsmRequests, onlineFallback, fullyOffline }));
          } finally {
            await browser.close();
          }
          NODE
