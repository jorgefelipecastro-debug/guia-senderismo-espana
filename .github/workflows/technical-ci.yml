name: Technical CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-only-publishable-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-service-role-key
        run: npm run build
