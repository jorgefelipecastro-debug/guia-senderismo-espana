name: Temporary Far GPS Production E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-far-gps-production-e2e.yml'

permissions:
  contents: read

jobs:
  far-gps-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify deployed release and far-GPS offline coverage
        env:
          BASE_URL: https://encumbrate-web-production.up.railway.app
          EXPECTED_RELEASE: 1f389642dbaf
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const expected = process.env.EXPECTED_RELEASE;
          const releaseResponse = await fetch(base + '/api/release');
          if (!releaseResponse.ok) throw new Error('release endpoint failed: ' + releaseResponse.status);
          const release = (await releaseResponse.json()).release;
          if (release !== expected) throw new Error(`Expected release ${expected}, got ${release}`);

          const farGps = { latitude: 38.4400, longitude: -0.4815, accuracy: 6 };
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            geolocation: farGps,
            permissions: ['geolocation'],
            viewport: { width: 390, height: 844 },
            serviceWorkers: 'block',
          });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);
          let firstOfflineRequest = true;
          let offlineRequests = 0;
          let blockedOsmRequests = 0;

          await page.route('**/*', async route => {
            const url = route.request().url();
            let parsed;
            try { parsed = new URL(url); } catch { return route.continue(); }

            if (parsed.hostname === 'tile.openstreetmap.org' || parsed.hostname.endsWith('.tile.openstreetmap.org')) {
              blockedOsmRequests += 1;
              await route.abort('failed');
              return;
            }

            if (parsed.pathname === '/api/maps/offline') {
              offlineRequests += 1;
              if (firstOfflineRequest) {
                firstOfflineRequest = false;
                await new Promise(resolve => setTimeout(resolve, 2200));
              }
            }

            await route.continue();
          });

          try {
            const response = await page.goto(base + '/offline-map-smoke-e2e', { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || response.status() !== 200) throw new Error('E2E route failed');

            await page.getByText('Mapa offline preparado', { exact: false }).waitFor();
            await page.getByText('Cartografía offline activa · mapa online no disponible', { exact: true }).waitFor();
            await page.locator('.hikerArrowIcon').waitFor();

            const beforeOffline = await page.evaluate(async ({ lat, lon }) => {
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open('encumbrate-offline-maps', 1);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              const record = await new Promise((resolve, reject) => {
                const tx = db.transaction('maps', 'readonly');
                const req = tx.objectStore('maps').get('offline_map_smoke_route');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
              db.close();

              if (!record?.bounds) throw new Error('offline map record missing');
              const R = 6378137;
              const x = R * lon * Math.PI / 180;
              const y = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
              const [west, south, east, north] = record.bounds;
              const coversGps = x >= west + 250 && x <= east - 250 && y >= south + 250 && y <= north - 250;

              const image = document.querySelector('.leaflet-image-layer');
              const map = document.querySelector('.liveGuideMap');
              const marker = document.querySelector('.hikerArrowIcon');
              if (!image || !map || !marker) throw new Error('map overlay or GPS marker missing');
              const ir = image.getBoundingClientRect();
              const mr = map.getBoundingClientRect();
              const cx = mr.left + mr.width / 2;
              const cy = mr.top + mr.height / 2;
              return {
                coversGps,
                imageCoversMapCenter: cx >= ir.left && cx <= ir.right && cy >= ir.top && cy <= ir.bottom,
                imageNaturalWidth: image.naturalWidth,
                imageNaturalHeight: image.naturalHeight,
                imageOpacity: Number(getComputedStyle(image).opacity),
              };
            }, { lat: farGps.latitude, lon: farGps.longitude });

            if (!beforeOffline.coversGps) throw new Error('Stored offline raster does not cover far GPS: ' + JSON.stringify(beforeOffline));
            if (!beforeOffline.imageCoversMapCenter) throw new Error('Offline raster does not cover centered GPS viewport: ' + JSON.stringify(beforeOffline));
            if (beforeOffline.imageOpacity < 0.99 || beforeOffline.imageNaturalWidth < 256 || beforeOffline.imageNaturalHeight < 256)
              throw new Error('Offline raster not visibly rendered: ' + JSON.stringify(beforeOffline));
            if (offlineRequests < 2) throw new Error(`Expected queued coverage refresh, got ${offlineRequests} offline map request(s)`);
            if (blockedOsmRequests < 1) throw new Error('OSM fallback was not exercised');

            await context.setOffline(true);
            await page.getByText('Sin conexión · cartografía offline activa', { exact: true }).waitFor();
            await page.waitForTimeout(1200);

            const fullyOffline = await page.evaluate(() => {
              const image = document.querySelector('.leaflet-image-layer');
              const map = document.querySelector('.liveGuideMap');
              const marker = document.querySelector('.hikerArrowIcon');
              if (!image || !map || !marker) throw new Error('offline view lost image or GPS marker');
              const ir = image.getBoundingClientRect();
              const mr = map.getBoundingClientRect();
              const cx = mr.left + mr.width / 2;
              const cy = mr.top + mr.height / 2;
              return {
                navigatorOnline: navigator.onLine,
                imageCoversMapCenter: cx >= ir.left && cx <= ir.right && cy >= ir.top && cy <= ir.bottom,
                opacity: Number(getComputedStyle(image).opacity),
                markerVisible: Boolean(marker),
              };
            });

            if (fullyOffline.navigatorOnline) throw new Error('Browser did not enter offline mode');
            if (!fullyOffline.imageCoversMapCenter || fullyOffline.opacity < 0.99 || !fullyOffline.markerVisible)
              throw new Error('Offline map did not survive full cutoff: ' + JSON.stringify(fullyOffline));

            console.log('FAR_GPS_OFFLINE_PRODUCTION_E2E_SUCCESS', JSON.stringify({
              release,
              offlineRequests,
              blockedOsmRequests,
              beforeOffline,
              fullyOffline,
            }));
          } finally {
            await browser.close();
          }
          NODE
