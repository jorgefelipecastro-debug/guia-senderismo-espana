<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#087f73"><title>Allzone - V15 - Fotos en PDF</title>
<style>html,body{margin:0;width:100%;height:100%;background:#eef3f3;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#loading{position:fixed;inset:0;display:grid;place-content:center;padding:25px;gap:18px;background:#eef3f3;color:#075f57;text-align:center}button{padding:14px;border:0;border-radius:10px;background:#087f73;color:#fff;font-weight:bold}</style></head>
<body><div id="loading"><h1>ALLZONE</h1><p id="status">Cargando V15 - Fotos en PDF...</p><button onclick="location.reload()">Volver a cargar</button></div>
<iframe id="trial" title="Parte de accidente Allzone" src="./index.html?allzone=v15.1" allow="camera; geolocation"></iframe>
<script>
const trial=document.getElementById('trial');
trial.addEventListener('load',()=>{
 try{
  const w=trial.contentWindow,d=trial.contentDocument;
  if(!d.querySelector('.shell'))throw new Error('No se ha cargado la aplicacion.');
  const s=d.createElement('script');s.src='./fotos-pdf-v15.js';
  s.onload=()=>{document.getElementById('loading').style.display='none';};
  s.onerror=()=>{document.getElementById('status').textContent='No se pudo cargar la mejora de fotos. Pulsa Volver a cargar.';};
  d.body.appendChild(s);
 }catch(err){document.getElementById('status').textContent='No se pudo abrir la aplicacion: '+err.message;}
});
</script></body></html>
