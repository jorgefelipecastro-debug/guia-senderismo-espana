<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#087f73"><title>Allzone - V15.2 - Continuar corregido</title>
<style>html,body{margin:0;width:100%;height:100%;background:#eef3f3;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#loading{position:fixed;inset:0;z-index:50;display:grid;place-content:center;padding:25px;gap:18px;background:#eef3f3;color:#075f57;text-align:center}button{padding:14px;border:0;border-radius:10px;background:#087f73;color:#fff;font-weight:bold}#status{line-height:1.5}</style>
</head>
<body>
<div id="loading"><h1>ALLZONE</h1><p id="status" role="status">Cargando V15.2 - Continuar corregido...</p><button type="button" id="reload">Volver a cargar</button></div>
<iframe id="trial" title="Parte de accidente Allzone V15.2" allow="camera; geolocation"></iframe>
<script>
'use strict';
const trial=document.getElementById('trial');
document.getElementById('reload').onclick=()=>location.reload();
function loadModule(d,src){return new Promise((resolve,reject)=>{const s=d.createElement('script');const timer=setTimeout(()=>reject(new Error('Tiempo de carga agotado: '+src)),20000);s.src=src;s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=()=>{clearTimeout(timer);reject(new Error('No se pudo cargar '+src));};d.body.appendChild(s);});}
trial.addEventListener('load',async()=>{
 try{
  const w=trial.contentWindow,d=trial.contentDocument;
  if(!d||!d.querySelector('.shell')||typeof w.render!=='function')throw new Error('No se ha cargado el formulario.');
  await loadModule(d,'./fotos-pdf-v15.js?build=v15.2');
  if(!w.AllzonePhotoPdf)throw new Error('No se ha iniciado el modulo de fotos.');
  await loadModule(d,'./navigation-v15-2.js');
  if(!w.AllzoneNavigation)throw new Error('No se ha iniciado la correccion de navegacion.');
  document.getElementById('loading').style.display='none';
 }catch(err){document.getElementById('status').textContent='No se pudo abrir esta version: '+err.message+' Pulsa Volver a cargar.';}
});
trial.src='./index.html?allzone=v15.2';
</script>
</body></html>
